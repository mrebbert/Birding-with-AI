# Dashboard "Birds".
#
# Settings -> Dashboards -> Add dashboard, then three-dot menu -> Raw
# configuration editor and paste this.
#
# Needs the HACS cards ApexCharts and Mushroom plus the four sensors from
# templates/birds.yaml. Replace SAEZURI_HOSTNAME with your collage address.

views:
  - title: Overview
    path: overview
    icon: mdi:bird
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.last_bird_species
        primary: "{{ states('sensor.last_bird_species') }}"
        secondary: >-
          {{ state_attr('sensor.last_bird_species', 'scientific_name') }} ·
          {{ (state_attr('sensor.last_bird_species', 'confidence') | float(0) * 100) | round(0) }} % ·
          {{ as_timestamp(state_attr('sensor.last_bird_species', 'detected_at'), 0) | timestamp_custom('%H:%M', true) }}
        icon: mdi:bird
        icon_color: >-
          {{ 'green' if state_attr('sensor.last_bird_species', 'confidence') | float(0) >= 0.8 else 'orange' }}
        multiline_secondary: true

      # entity: on each card, so a tap opens the entity with its history.
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.bird_species_total
            primary: "{{ states('sensor.bird_species_total') }}"
            secondary: Species total
            icon: mdi:format-list-bulleted
            icon_color: teal
          - type: custom:mushroom-template-card
            entity: sensor.bird_species_today
            primary: "{{ states('sensor.bird_species_today') }}"
            secondary: Species today
            icon: mdi:calendar-today
            icon_color: teal
          - type: custom:mushroom-template-card
            entity: sensor.bird_detections_today
            primary: "{{ states('sensor.bird_detections_today') }}"
            secondary: Detections today
            icon: mdi:waveform
            icon_color: teal

      - type: custom:mushroom-entity-card
        entity: binary_sensor.birdnet_go_status
        name: BirdNET-Go
        icon: mdi:server-network

      - type: custom:apexcharts-card
        header:
          show: true
          title: Detections per hour
        graph_span: 24h
        span:
          start: day
        series:
          - entity: sensor.bird_detections_today
            name: Detections
            type: column
            group_by:
              func: diff
              duration: 1h
              # Without this, hours without a data point draw null instead of zero.
              fill: zero

      - type: markdown
        title: Heard today
        content: >-
          {% set species = state_attr('sensor.bird_species_today', 'species') %}
          {{ species | join(', ') if species else 'Nothing detected yet.' }}

      - type: markdown
        title: All species
        content: >-
          **{{ states('sensor.bird_species_total') }} species since the start**

          {{ state_attr('sensor.bird_species_total', 'species') | join(', ') }}

      # The raw entity would record every empty state as Unknown and Unavailable.
      - type: logbook
        title: History
        entities:
          - sensor.last_bird_species
        hours_to_show: 24

  # The Bird Card, installed from HACS as a custom repository:
  # https://github.com/adamoberley/HABirdDashboard, type Dashboard.
  # It draws the collage inside Home Assistant, so no iframe is involved.
  - title: Collage
    path: collage
    icon: mdi:image-multiple
    panel: true
    cards:
      - type: custom:habird-card
        view: collage
        # The browser queries BirdNET-Go directly, so this address must be
        # reachable from the browser. Use the HTTPS name from the reverse
        # proxy: the loopback port is unreachable, and plain HTTP on an
        # HTTPS dashboard is blocked as mixed content.
        birdnet_url: https://BIRDNET_HOSTNAME
        # auto: the API first, Home Assistant history as the fallback.
        data_source: auto
        ha_sensors:
          - sensor.birdnet_go_SOURCE_SLUG_scientific_name
        names: common
        window: "24"
        sit_confidence: 0.90
        tap_action: info
        clock: false
        weather: false
        background: transparent
        # Artwork lazy-loads per species from a CDN. For a fully local
        # install, copy the card's avian/assets/ to /config/www/habird-art/
        # and uncomment:
        # image_base: /local/habird-art/
